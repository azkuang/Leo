version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    # The agent stream carries a oneof envelope in each direction.
    # AgentMessage/ControlMessage name the direction, which is what a reader
    # needs; ConnectRequest/ConnectResponse would not.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
