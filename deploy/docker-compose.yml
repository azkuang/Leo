# Control plane only.
#
# Agents are not containers here: they need the host's devices, driver and
# container runtime, so they install as systemd units on the machines
# themselves. The control plane is the part that is identical everywhere and so
# the part worth packaging.

name: orch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orch
      POSTGRES_PASSWORD: orch
      POSTGRES_DB: orch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # orchd waits for the database itself, but a healthcheck means
      # `docker compose up` reports the real story while it starts.
      test: ["CMD-SHELL", "pg_isready -U orch -d orch"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orch
      MINIO_ROOT_PASSWORD: orchorch
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Inputs and results move directly between clients, agents and this
      # bucket. The control plane never sees a payload.
      - "9000:9000"
      - "9001:9001"

  # One-shot: creates the bucket orchd/agents expect (ORCH_S3_BUCKET below)
  # so `docker compose up` alone is enough to exercise the data plane --
  # without this, every upload fails with NoSuchBucket until someone runs
  # `mc mb` by hand.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 orch orchorch &&
      mc mb --ignore-existing local/orch
      "

  orchd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ORCH_DSN: postgres://orch:orch@postgres:5432/orch?sslmode=disable
      ORCH_LISTEN: ":9443"
      ORCH_LOG_LEVEL: info
      # STS-minted, per-lease write credentials -- see README.md's
      # "Object storage" section. AccessKey/SecretKey here are the broad
      # admin credential used only to call AssumeRole; agents only ever see
      # the narrow, expiring credential that call returns.
      #
      # This must be reachable from every agent node, not just from other
      # containers on this compose network -- "minio" only resolves inside
      # Docker's embedded DNS. Bare-metal agents (leo-test, leo-test2, ...)
      # resolve it via the host's real LAN address instead. minio/postgres
      # still address each other as "minio"/"postgres" fine; only the value
      # handed out to agents via mintCreds needs to be externally reachable.
      ORCH_S3_ENDPOINT: 10.37.173.128:9000
      ORCH_S3_STS_ENDPOINT: 10.37.173.128:9000
      ORCH_S3_BUCKET: orch
      ORCH_S3_ACCESS_KEY: orch
      ORCH_S3_SECRET_KEY: orchorch
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    ports:
      # Agents, API clients and the UI all arrive here. One port, because the
      # UI is embedded in the binary.
      - "9443:9443"

volumes:
  pgdata:
  miniodata:
