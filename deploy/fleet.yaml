# Declarative fleet definition, applied with:
#
#   orchctl bootstrap deploy/fleet.yaml
#
# Idempotent: applying it twice changes nothing the second time. Nodes are named
# by hostname because that is what a human knows; the node IDs they map to are
# assigned by the control plane and never typed by anyone.
#
# This file is a refinement, not a prerequisite. An empty database is a valid
# state: one implicit `default` pool containing every node, no quotas, no
# borrowing.

pools:
  # The CAD team owns these machines outright. They lend idle capacity but never
  # borrow -- a borrow ceiling of zero says "we are a lender, not a borrower".
  - name: cad
    nodes: [cad-01, cad-02]
    lendable: true
    borrow_ceiling: 0

  # The render pool owns one modest box and makes up the difference by
  # borrowing, up to four slots at a time.
  - name: render
    nodes: [render-01]
    lendable: true
    borrow_ceiling: 4

policy:
  preset: throughput
  weights:
    fit: 0.4
    queue_depth: 0.3
    thermal: 0.2
    borrow_penalty: 0.1
